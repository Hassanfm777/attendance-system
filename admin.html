<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإدارة | تقارير الدوام</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #ecf0f1; padding: 20px; margin: 0; }
        .panel { background: white; max-width: 1200px; margin: 20px auto; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 15px; margin-bottom: 20px;}
        .login-sec { text-align: center; margin-top: 50px; }
        input[type="password"] { padding: 12px; width: 250px; text-align: center; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #27ae60; color: white; padding: 12px 25px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ecc71; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; justify-content: center; flex-wrap: wrap;}
        .tab-btn { background: #ecf0f1; color: #7f8c8d; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.3s; font-weight: bold;}
        .tab-btn.active { background: #3498db; color: white; }
        .tab-btn:hover:not(.active) { background: #bdc3c7; color: white;}
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .controls-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-weight: bold; font-size: 14px; color: #2c3e50;}
        select, input[type="date"] { padding: 8px; font-size: 15px; border-radius: 5px; border: 1px solid #ccc; min-width: 200px; font-family: inherit;}
        table { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: 20px;}
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background: #34495e; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        .badge-in { background: #2ecc71; color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold;}
        .badge-out { background: #e74c3c; color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold;}
        a { color: #2980b9; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .dev-info { font-size: 11px; color: #7f8c8d; direction: ltr; text-align: left; }
        .pass-text { font-family: monospace; font-size: 18px; color: #c0392b; font-weight: bold; background: #fadbd8; padding: 5px 10px; border-radius: 5px;}
        
        /* تنسيق خاص للوقت لضمان عدم تداخله */
        .time-cell { font-family: Tahoma, sans-serif; }
        .date-part { color: #2c3e50; font-weight: bold; display: inline-block; direction: ltr; }
        .time-part { color: #e67e22; font-weight: bold; display: inline-block; direction: ltr; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="panel" id="loginPanel">
        <h2>دخول الإدارة</h2>
        <div class="login-sec">
            <input type="password" id="adminCode" placeholder="كلمة مرور الإدارة">
            <br><br>
            <button onclick="verifyAdmin()">تسجيل الدخول</button>
            <p id="err" style="color:red;"></p>
        </div>
    </div>

    <div class="panel" id="dataPanel" style="display: none;">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('attendanceTab', this)">📋 سجل الحضور والمواقع</button>
            <button class="tab-btn" onclick="switchTab('usersTab', this)">🔐 أرقام الموظفين السرية</button>
        </div>

        <div id="attendanceTab" class="tab-content active">
            <div class="controls-bar">
                <div class="filter-group">
                    <label>اسم الموظف:</label>
                    <select id="empFilter" onchange="renderTable()">
                        <option value="all">عرض جميع الموظفين</option>
                        <option value="Suhail Satar">Suhail Satar</option>
                        <option value="bayna ahmed">bayna ahmed</option>
                        <option value="Fatmah yamahi">Fatmah yamahi</option>
                        <option value="Deema">Deema</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>من تاريخ:</label>
                    <input type="date" id="startDate" onchange="renderTable()">
                </div>
                <div class="filter-group">
                    <label>إلى تاريخ:</label>
                    <input type="date" id="endDate" onchange="renderTable()">
                </div>
                
                <button onclick="exportCSV()" style="background:#2980b9;">📥 تحميل (Excel)</button>
            </div>
            
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>البصمة</th>
                            <th>التاريخ والوقت</th>
                            <th>الموقع (GPS)</th>
                            <th>معلومات الجهاز</th>
                        </tr>
                    </thead>
                    <tbody id="tBody"></tbody>
                </table>
            </div>
        </div>

        <div id="usersTab" class="tab-content">
            <h3 style="text-align: center; color: #2c3e50;">قائمة الموظفين والأرقام السرية المعتمدة</h3>
            <div style="overflow-x:auto; max-width: 600px; margin: 0 auto;">
                <table>
                    <thead>
                        <tr>
                            <th>اسم الموظف</th>
                            <th>الرقم السري</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td><strong>Suhail Satar</strong></td><td><span class="pass-text">suh9988</span></td></tr>
                        <tr><td><strong>bayna ahmed</strong></td><td><span class="pass-text">bay5544</span></td></tr>
                        <tr><td><strong>Fatmah yamahi</strong></td><td><span class="pass-text">fat7766</span></td></tr>
                        <tr><td><strong>Deema</strong></td><td><span class="pass-text">dee3322</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const dbUrl = "https://attendance-system-47995-default-rtdb.firebaseio.com/attendance.json";
        let rawData = [];
        let filteredData = [];

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function verifyAdmin() {
            if (document.getElementById("adminCode").value === "112233") {
                document.getElementById("loginPanel").style.display = "none";
                document.getElementById("dataPanel").style.display = "block";
                loadRecords();
            } else {
                document.getElementById("err").innerText = "كلمة المرور غير صحيحة!";
            }
        }

        function loadRecords() {
            fetch(dbUrl)
            .then(res => res.json())
            .then(data => {
                rawData = [];
                if (data && !data.error) {
                    for (let key in data) { rawData.push(data[key]); }
                }
                renderTable();
            })
            .catch(e => alert("حدث خطأ في جلب البيانات من السيرفر."));
        }

        function getRecordDate(record) {
            if (record.isoDate) return record.isoDate; 
            if (record.serverTime) {
                let d = new Date(record.serverTime);
                return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
            }
            return ""; 
        }

        // دالة جديدة لتنظيف وترتيب الوقت برمجياً
        function formatCleanTime(serverTimestamp) {
            if (!serverTimestamp) return { html: "غير متوفر", text: "غير متوفر" };
            
            let d = new Date(serverTimestamp);
            let year = d.getFullYear();
            let month = String(d.getMonth() + 1).padStart(2, '0');
            let day = String(d.getDate()).padStart(2, '0');
            
            let hours = d.getHours();
            let minutes = String(d.getMinutes()).padStart(2, '0');
            let ampm = hours >= 12 ? 'م' : 'ص';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // تحويل الصفر إلى 12
            
            let htmlFormat = `<span class="date-part">${year}/${month}/${day}</span><br><span class="time-part">${hours}:${minutes} ${ampm}</span>`;
            let textFormat = `${year}/${month}/${day} - ${hours}:${minutes} ${ampm}`;
            
            return { html: htmlFormat, text: textFormat };
        }

        function renderTable() {
            const tbody = document.getElementById("tBody");
            const emp = document.getElementById("empFilter").value;
            const sDate = document.getElementById("startDate").value;
            const eDate = document.getElementById("endDate").value;
            
            tbody.innerHTML = "";
            filteredData = [];

            if (rawData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5'>لا توجد بيانات حضور حتى الآن.</td></tr>";
                return;
            }

            filteredData = rawData.filter(r => {
                let matchName = (emp === "all") || (r.employeeName === emp);
                let recordDate = getRecordDate(r);
                let matchStart = sDate ? (recordDate >= sDate) : true;
                let matchEnd = eDate ? (recordDate <= eDate) : true;
                return matchName && matchStart && matchEnd;
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5'>لا توجد سجلات تطابق الفلتر الذي اخترته.</td></tr>";
                return;
            }

            filteredData.sort((a, b) => (b.serverTime || 0) - (a.serverTime || 0));

            filteredData.forEach(r => {
                let locHtml = r.location && r.location.includes("http") ? `<a href="${r.location}" target="_blank">📍 عرض الخريطة</a>` : "مرفوض/مجهول";
                let typeBadge = r.attendanceType === 'حضور' ? `<span class="badge-in">حضور</span>` : (r.attendanceType === 'انصراف' ? `<span class="badge-out">انصراف</span>` : 'غير محدد');
                
                // استخدام الدالة الجديدة للوقت
                let timeData = formatCleanTime(r.serverTime);

                tbody.innerHTML += `<tr>
                    <td><strong>${r.employeeName || ''}</strong></td>
                    <td>${typeBadge}</td>
                    <td class="time-cell">${timeData.html}</td>
                    <td>${locHtml}</td>
                    <td class="dev-info">${r.deviceInfo || ''}</td>
                </tr>`;
            });
        }

        function exportCSV() {
            if (filteredData.length === 0) { alert("لا توجد بيانات للتحميل"); return; }
            let csv = "\uFEFFالاسم,نوع البصمة,التاريخ والوقت,الموقع,معلومات الجهاز\n";
            filteredData.forEach(r => {
                let n = r.employeeName || "";
                let type = r.attendanceType || "غير محدد";
                
                // استخدام الوقت النظيف للإكسل
                let timeData = formatCleanTime(r.serverTime);
                let t = timeData.text; 

                let l = (r.location || "").replace(/,/g, " ");
                let d = (r.deviceInfo || "").replace(/,/g, " ");
                csv += `${n},${type},${t},${l},${d}\n`;
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            link.download = "تقرير_دوام_الموظفين.csv";
            link.click();
        }
    </script>
</body>
</html>
