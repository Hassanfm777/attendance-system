<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية | تقارير وبصمة الدوام</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #1e3a8a; --primary-light: #3b82f6; --success: #10b981;
            --danger: #ef4444; --dark: #1f2937; --light-bg: #f3f4f6;
            --card-bg: #ffffff; --border-color: #e5e7eb;
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background: var(--light-bg); color: var(--dark); padding: 20px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header-img { width: 100%; max-width: 900px; height: auto; margin-bottom: 20px; border-radius: 8px; mix-blend-mode: multiply; }
        .container { width: 100%; max-width: 1300px; margin: 0 auto; }

        .login-card { background: var(--card-bg); max-width: 420px; margin: 60px auto; padding: 35px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); text-align: center; border: 1px solid var(--border-color); }
        .login-card h2 { color: var(--primary); margin-bottom: 10px; font-size: 24px; }
        .login-input-group { position: relative; margin-bottom: 20px; text-align: right; }
        .login-input-group label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; color: #4b5563; }
        .login-input-group input, .login-input-group select { width: 100%; padding: 12px 15px; border: 2px solid var(--border-color); border-radius: 10px; font-size: 15px; outline: none; font-weight: 600; }
        .btn-login { width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }

        .panel { background: var(--card-bg); width: 100%; padding: 25px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid var(--border-color); }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; padding-bottom: 20px; border-bottom: 2px solid var(--light-bg); margin-bottom: 25px; }
        .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        
        .btn-action { display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 8px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; color: white; transition: 0.2s;}
        .btn-export { background: #059669; } .btn-refresh { background: var(--primary); } .btn-logout { background: #ef4444; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--light-bg); padding-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { background: transparent; color: #6b7280; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .controls-bar { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; }
        .filter-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 160px; }
        .filter-group label { font-size: 13px; font-weight: 700; color: #374151; }
        select, input[type="date"], input[type="text"], input[type="password"] { padding: 9px 12px; font-size: 14px; border-radius: 8px; border: 1px solid #d1d5db; outline: none; width: 100%; font-family: inherit;}
        
        .table-container { overflow-x: auto; border: 1px solid var(--border-color); border-radius: 10px; background: white; margin-bottom: 20px;}
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { background: #1e293b; color: white; padding: 14px 12px; font-size: 13px; white-space: nowrap; }
        td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #334155; }
        
        .badge-in { background: #dcfce7; color: #15803d; padding: 5px 10px; border-radius: 20px; font-weight: 700; font-size: 12px;} 
        .badge-out { background: #fee2e2; color: #b91c1c; padding: 5px 10px; border-radius: 20px; font-weight: 700; font-size: 12px;}
        .btn-delete { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;}
        .btn-add { background: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .map-box { background:#eff6ff; border:1px solid #bfdbfe; padding:5px; border-radius:8px; display:inline-block; font-size: 12px; }
        .map-box a { color:#1d4ed8; text-decoration:none; font-weight:bold; }
    </style>
</head>
<body>

    <img src="header.png" alt="Header" class="header-img" onerror="this.style.display='none'">

    <div class="container">
        
        <!-- صفحة الدخول للإدارة -->
        <div class="login-card" id="loginPanel">
            <h2 style="color:var(--primary);"><i class="fa-solid fa-user-shield"></i> لوحة الإدارة</h2>
            
            <div class="login-input-group">
                <label>نوع الحساب</label>
                <select id="adminRole">
                    <option value="manager">المدير العام</option>
                    <option value="hr">شؤون الموظفين</option>
                </select>
            </div>
            <div class="login-input-group">
                <label>كلمة المرور</label>
                <input type="password" id="adminCode" placeholder="أدخل رمز الدخول">
            </div>
            <button class="btn-login" onclick="verifyAdmin()">دخول</button>
        </div>

        <div class="panel" id="dataPanel" style="display: none;">
            
            <div class="dashboard-header">
                <h2><i class="fa-solid fa-chart-line"></i> الإدارة وتقارير الحضور</h2>
                <div class="header-actions">
                    <button class="btn-action btn-refresh" onclick="loadData()"><i class="fa-solid fa-arrows-rotate"></i> تحديث</button>
                    <button class="btn-action btn-export" onclick="exportCSV()"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
                    <button class="btn-action btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
                </div>
            </div>

            <!-- التبويبات -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('attendanceTab', this)"><i class="fa-solid fa-table-list"></i> سجل الحضور الشامل</button>
                <button class="tab-btn" onclick="switchTab('usersTab', this)"><i class="fa-solid fa-users-gear"></i> إدارة الموظفين (إضافة وحذف)</button>
            </div>

            <!-- تبويب سجل الحضور -->
            <div id="attendanceTab" class="tab-content active">
                <div class="controls-bar">
                    <div class="filter-row">
                        <div class="filter-group" style="flex: 2;">
                            <label>بحث (الاسم أو الملاحظة):</label>
                            <input type="text" id="searchInput" placeholder="اكتب للبحث..." oninput="renderTable()">
                        </div>
                        <div class="filter-group">
                            <label>من تاريخ:</label>
                            <input type="date" id="startDate" onchange="renderTable()">
                        </div>
                        <div class="filter-group">
                            <label>إلى تاريخ:</label>
                            <input type="date" id="endDate" onchange="renderTable()">
                        </div>
                    </div>
                </div>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>الاسم</th>
                                <th>الحركة</th>
                                <th>الوقت والتاريخ</th>
                                <th>المدينة والموقع</th>
                                <th>المسافة</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="tBody">
                            <tr><td colspan="6" style="padding: 30px;">جاري تحميل السجلات...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- تبويب إدارة الموظفين الديناميكية -->
            <div id="usersTab" class="tab-content">
                
                <!-- إضافة موظف جديد -->
                <div class="controls-bar">
                    <h4 style="margin-bottom: 10px; color: var(--primary);"><i class="fa-solid fa-user-plus"></i> إضافة موظف جديد لنظام البصمة</h4>
                    <div class="filter-row">
                        <div class="filter-group">
                            <label>الاسم الكامل:</label>
                            <input type="text" id="newEmpName" placeholder="مثال: أحمد محمد">
                        </div>
                        <div class="filter-group">
                            <label>الرقم السري (PIN):</label>
                            <input type="password" id="newEmpPin" placeholder="يفضل أن يكون أرقاماً وحروفاً">
                        </div>
                        <div class="filter-group" style="flex: 0.5;">
                            <label>&nbsp;</label>
                            <button class="btn-add" onclick="addNewEmployee()"><i class="fa-solid fa-plus"></i> حفظ الموظف</button>
                        </div>
                    </div>
                </div>

                <div class="table-container" style="max-width: 750px; margin: 0 auto;">
                    <table>
                        <thead>
                            <tr><th>اسم الموظف</th><th>الرقم السري</th><th>إجراءات</th></tr>
                        </thead>
                        <tbody id="usersTbody">
                            <tr><td colspan="3">جاري تحميل الموظفين...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        const baseUrl = "https://attendance-system-47995-default-rtdb.firebaseio.com"; 
        
        const ADMIN_CREDENTIALS = {
            "manager": "112233",
            "hr": "445566"
        };

        let rawData = [], filteredData = [];
        let usersData = {};

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('adminRole')) showDashboard();
        });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function verifyAdmin() {
            const role = document.getElementById("adminRole").value;
            const pass = document.getElementById("adminCode").value.trim();
            if (ADMIN_CREDENTIALS[role] === pass) {
                sessionStorage.setItem('adminRole', role); 
                showDashboard();
            } else {
                Swal.fire('خطأ', 'كلمة المرور غير صحيحة!', 'error');
            }
        }

        function showDashboard() {
            document.getElementById("loginPanel").style.display = "none";
            document.getElementById("dataPanel").style.display = "block";
            
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("startDate").value = today; 
            document.getElementById("endDate").value = today;
            
            loadData();
        }

        function logout() { sessionStorage.removeItem('adminRole'); location.reload(); }

        function loadData() {
            loadAttendance();
            loadUsers();
        }

        // --- قسم إدارة الموظفين ---
        function loadUsers() {
            fetch(`${baseUrl}/users.json`).then(res => res.json()).then(data => {
                usersData = data || {};
                const tbody = document.getElementById("usersTbody");
                tbody.innerHTML = "";
                
                if(Object.keys(usersData).length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3">لا يوجد موظفين حالياً. قم بإضافة موظف جديد.</td></tr>`;
                    return;
                }

                for(let key in usersData) {
                    tbody.innerHTML += `
                    <tr>
                        <td><strong>${usersData[key].name}</strong></td>
                        <td style="font-family:monospace; color:red; font-weight:bold;">${usersData[key].pin}</td>
                        <td><button class="btn-delete" onclick="deleteEmployee('${key}')"><i class="fa-solid fa-trash"></i> حذف</button></td>
                    </tr>`;
                }
            });
        }

        function addNewEmployee() {
            const name = document.getElementById("newEmpName").value.trim();
            const pin = document.getElementById("newEmpPin").value.trim();
            
            if(!name || !pin) return Swal.fire('تنبيه', 'يرجى إدخال الاسم والرقم السري', 'warning');

            fetch(`${baseUrl}/users.json`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: name, pin: pin })
            }).then(res => {
                if(res.ok) {
                    Swal.fire('نجاح', 'تم إضافة الموظف بنجاح! سيظهر الآن في صفحة البصمة.', 'success');
                    document.getElementById("newEmpName").value = '';
                    document.getElementById("newEmpPin").value = '';
                    loadUsers();
                }
            });
        }

        function deleteEmployee(key) {
            Swal.fire({ title: 'هل أنت متأكد؟', text: "سيتم حذف الموظف نهائياً!", icon: 'warning', showCancelButton: true, confirmButtonText: 'نعم، احذف', cancelButtonText: 'إلغاء' })
            .then((result) => {
                if (result.isConfirmed) {
                    fetch(`${baseUrl}/users/${key}.json`, { method: 'DELETE' })
                    .then(() => { Swal.fire('تم الحذف', '', 'success'); loadUsers(); });
                }
            });
        }

        // --- قسم تقارير الحضور ---
        function loadAttendance() {
            const tbody = document.getElementById("tBody");
            tbody.innerHTML = `<tr><td colspan="6"><i class="fa-solid fa-spinner fa-spin"></i> جاري التحميل...</td></tr>`;

            fetch(`${baseUrl}/attendance.json`).then(res => res.json()).then(data => {
                rawData = [];
                if (data && !data.error) {
                    for (let key in data) { let item = data[key]; item._key = key; rawData.push(item); }
                }
                renderTable();
            }).catch(err => { tbody.innerHTML = `<tr><td colspan="6" style="color:red;">خطأ بالاتصال بالانترنت</td></tr>`; });
        }

        function deleteRecord(recordKey) {
            Swal.fire({
                title: 'هل أنت متأكد؟', text: "لن تتمكن من التراجع وسيتم مسح البصمة!", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'نعم، احذف!', cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'جاري الحذف...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
                    
                    // الكود الصحيح للحذف مع التعامل مع الأخطاء بدقة
                    fetch(`${baseUrl}/attendance/${recordKey}.json`, { 
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' }
                    })
                    .then(res => {
                        if (res.ok) {
                            Swal.fire('نجاح', 'تم حذف السجل بنجاح.', 'success');
                            loadAttendance();
                        } else {
                            throw new Error("API responded with status " + res.status);
                        }
                    })
                    .catch(err => {
                        console.error("Delete Error:", err);
                        Swal.fire('خطأ!', 'حدث خطأ أثناء الاتصال بالخادم. تأكد من الصلاحيات.', 'error');
                    });
                }
            });
        }

        function renderTable() {
            const tbody = document.getElementById("tBody");
            const searchTxt = document.getElementById("searchInput").value.trim().toLowerCase();
            const sDate = document.getElementById("startDate").value, eDate = document.getElementById("endDate").value;

            tbody.innerHTML = ""; filteredData = [];

            filteredData = rawData.filter(r => {
                let dStr = r.serverTime ? new Date(r.serverTime).toISOString().split('T')[0] : "";
                let matchDate = (!sDate || dStr >= sDate) && (!eDate || dStr <= eDate);
                let matchSearch = true;
                if (searchTxt) matchSearch = `${r.employeeName || ''} ${r.note || ''} ${r.city || ''}`.toLowerCase().includes(searchTxt);
                return matchDate && matchSearch;
            });

            filteredData.sort((a,b) => (b.serverTime || 0) - (a.serverTime || 0));

            if (filteredData.length === 0) return tbody.innerHTML = `<tr><td colspan="6" style="padding: 30px;">لا توجد سجلات.</td></tr>`;

            filteredData.forEach(r => {
                let typeBadge = r.attendanceType === 'حضور' ? `<span class="badge-in">حضور</span>` : `<span class="badge-out">انصراف</span>`;
                
                // تجهيز مربع الخريطة والمدينة
                let locDisplay = '—';
                if(r.city || r.location) {
                    locDisplay = `<div class="map-box">
                        <div style="color:#1e3a8a; font-weight:bold; margin-bottom:4px;"><i class="fa-solid fa-city"></i> ${r.city || 'غير محدد'}</div>
                        ${r.location ? `<a href="${r.location}" target="_blank"><i class="fa-solid fa-map-location-dot"></i> فتح الخريطة</a>` : ''}
                    </div>`;
                }
                
                let d = new Date(r.serverTime);
                let timeFmt = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} <br><strong style="color:#d97706;">${d.toLocaleTimeString('ar-EG')}</strong>`;

                tbody.innerHTML += `<tr>
                    <td><strong>${r.employeeName || '—'}</strong><br><small style="color:#64748b;">${r.note||''}</small></td>
                    <td>${typeBadge}</td>
                    <td dir="ltr">${timeFmt}</td>
                    <td>${locDisplay}</td>
                    <td><strong style="color:#059669;">${r.distance || '—'}</strong></td>
                    <td><button class="btn-delete" onclick="deleteRecord('${r._key}')"><i class="fa-solid fa-trash-can"></i> حذف</button></td>
                </tr>`;
            });
        }

        function exportCSV() {
            let csv = "\uFEFFالاسم,نوع الحركة,الوقت,المدينة,المسافة,الملاحظات\n";
            filteredData.forEach(r => {
                let d = new Date(r.serverTime);
                let time = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes()}`;
                csv += `"${r.employeeName||''}","${r.attendanceType||''}","${time}","${r.city||''}","${r.distance||''}","${r.note||''}"\n`;
            });
            const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            link.download = `تقرير_الدوام.csv`; link.click();
        }
    </script>
</body>
</html>
