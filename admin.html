<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإدارة | تقارير الدوام</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #ecf0f1; padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center;}
        
        .header-img { width: 100%; max-width: 800px; height: auto; margin-bottom: 20px; mix-blend-mode: multiply; }
        .footer-img { width: 100%; max-width: 800px; height: auto; margin-top: 40px; mix-blend-mode: multiply; opacity: 0.9; }

        .panel { background: white; width: 100%; max-width: 1200px; margin: 0 auto; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 15px; margin-bottom: 20px;}
        .login-sec { text-align: center; margin-top: 50px; }
        input[type="password"] { padding: 12px; width: 250px; text-align: center; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #27ae60; color: white; padding: 12px 25px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; justify-content: center; flex-wrap: wrap;}
        .tab-btn { background: #ecf0f1; color: #7f8c8d; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.3s; font-weight: bold;}
        .tab-btn.active { background: #3498db; color: white; }
        .tab-btn:hover:not(.active) { background: #bdc3c7; color: white;}
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .controls-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        select, input[type="date"] { padding: 8px; font-size: 15px; border-radius: 5px; border: 1px solid #ccc; min-width: 200px;}
        table { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: 20px;}
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; font-size: 14px;}
        th { background: #34495e; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        .row-failed { background-color: #ffeaea !important; }
        .badge-in { background: #2ecc71; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size:12px;}
        .badge-out { background: #e74c3c; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size:12px;}
        a { color: #2980b9; text-decoration: none; font-weight: bold; }
        .note-td { color: #7f8c8d; font-style: italic; max-width: 200px; word-wrap: break-word;}
        .pass-text { font-family: monospace; font-size: 18px; color: #c0392b; font-weight: bold; background: #fadbd8; padding: 5px 10px; border-radius: 5px;}
    </style>
</head>
<body>

    <img src="header.png" alt="Stars Poly Header" class="header-img">

    <div class="panel" id="loginPanel">
        <h2>دخول الإدارة</h2>
        <div class="login-sec">
            <input type="password" id="adminCode" placeholder="كلمة مرور الإدارة">
            <br><br>
            <button onclick="verifyAdmin()">تسجيل الدخول</button>
            <p id="err" style="color:red;"></p>
        </div>
    </div>

    <div class="panel" id="dataPanel" style="display: none;">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('attendanceTab', this)">📋 سجل الحضور الشامل</button>
            <button class="tab-btn" onclick="switchTab('usersTab', this)">🔐 أرقام الموظفين السرية</button>
        </div>

        <div id="attendanceTab" class="tab-content active">
            <div class="controls-bar">
                <div class="filter-group">
                    <label>تصفية حسب الاسم:</label>
                    <select id="empFilter" onchange="renderTable()">
                        <option value="all">عرض الجميع</option>
                        <optgroup label="الموظفين">
                            <option value="Suhail Satar">Suhail Satar</option>
                            <option value="bayna ahmed">bayna ahmed</option>
                            <option value="Fatmah yamahi">Fatmah yamahi</option>
                            <option value="Deema">Deema</option>
                        </optgroup>
                        <optgroup label="السائقين">
                            <option value="أيمن">أيمن</option>
                            <option value="ربيع">ربيع</option>
                            <option value="سليم">سليم</option>
                        </optgroup>
                        <optgroup label="المحصلين">
                            <option value="علاء">علاء</option>
                            <option value="عيشة">عيشة</option>
                        </optgroup>
                    </select>
                </div>
                <div class="filter-group"><label>من:</label><input type="date" id="startDate" onchange="renderTable()"></div>
                <div class="filter-group"><label>إلى:</label><input type="date" id="endDate" onchange="renderTable()"></div>
                <button onclick="exportCSV()" style="background:#2980b9;">📥 تحميل (Excel)</button>
            </div>
            
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr><th>الاسم</th><th>القسم</th><th>البصمة</th><th>التاريخ والوقت</th><th>ملاحظة</th><th>الموقع</th></tr>
                    </thead>
                    <tbody id="tBody"></tbody>
                </table>
            </div>
        </div>

        <div id="usersTab" class="tab-content">
            <h3 style="text-align: center; color: #2c3e50;">قائمة الأرقام السرية المعتمدة</h3>
            <div style="overflow-x:auto; max-width: 600px; margin: 0 auto;">
                <table>
                    <thead><tr><th>الاسم</th><th>القسم</th><th>الرقم السري</th></tr></thead>
                    <tbody>
                        <tr><td><strong>Suhail Satar</strong></td><td>موظف</td><td><span class="pass-text">suh9988</span></td></tr>
                        <tr><td><strong>bayna ahmed</strong></td><td>موظف</td><td><span class="pass-text">bay5544</span></td></tr>
                        <tr><td><strong>Fatmah yamahi</strong></td><td>موظف</td><td><span class="pass-text">fat7766</span></td></tr>
                        <tr><td><strong>Deema</strong></td><td>موظف</td><td><span class="pass-text">dee3322</span></td></tr>
                        <tr><td><strong>أيمن</strong></td><td>سائق</td><td><span class="pass-text">aym33</span></td></tr>
                        <tr><td><strong>ربيع</strong></td><td>سائق</td><td><span class="pass-text">rab44</span></td></tr>
                        <tr><td><strong>سليم</strong></td><td>سائق</td><td><span class="pass-text">sal55</span></td></tr>
                        <tr><td><strong>علاء</strong></td><td>محصل</td><td><span class="pass-text">alaa11</span></td></tr>
                        <tr><td><strong>عيشة</strong></td><td>محصل</td><td><span class="pass-text">aish22</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <img src="footer_img.png" alt="Stars Poly Footer" class="footer-img">

    <script>
        const dbUrl = "https://attendance-system-47995-default-rtdb.firebaseio.com/attendance.json";
        let rawData = [], filteredData = [];

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function verifyAdmin() {
            if (document.getElementById("adminCode").value === "112233") {
                document.getElementById("loginPanel").style.display = "none";
                document.getElementById("dataPanel").style.display = "block";
                loadRecords();
            } else { document.getElementById("err").innerText = "كلمة المرور غير صحيحة!"; }
        }

        function loadRecords() {
            fetch(dbUrl).then(res => res.json()).then(data => {
                rawData = [];
                if (data && !data.error) { for (let key in data) rawData.push(data[key]); }
                renderTable();
            });
        }

        function formatTime(st) {
            if (!st) return "";
            let d = new Date(st), yr = d.getFullYear(), mo = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
            let hr = d.getHours(), min = String(d.getMinutes()).padStart(2,'0'), ampm = hr >= 12 ? 'م' : 'ص';
            hr = hr % 12; hr = hr ? hr : 12;
            return `${yr}/${mo}/${day} <br><span style="color:#e67e22;font-weight:bold">${hr}:${min} ${ampm}</span>`;
        }
        function formatTimeExcel(st) {
            if (!st) return "";
            let d = new Date(st);
            return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} - ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function renderTable() {
            const tbody = document.getElementById("tBody"), emp = document.getElementById("empFilter").value;
            const sDate = document.getElementById("startDate").value, eDate = document.getElementById("endDate").value;
            tbody.innerHTML = ""; filteredData = [];

            filteredData = rawData.filter(r => {
                let dStr = r.serverTime ? new Date(r.serverTime).toISOString().split('T')[0] : "";
                return (emp === "all" || r.employeeName === emp) && (!sDate || dStr >= sDate) && (!eDate || dStr <= eDate);
            });
            filteredData.sort((a,b) => (b.serverTime||0) - (a.serverTime||0));

            filteredData.forEach(r => {
                let loc = r.location && r.location.includes("http") ? `<a href="${r.location}" target="_blank">📍 خريطة</a>` : "مرفوض";
                let type = r.attendanceType === 'حضور' ? `<span class="badge-in">حضور</span>` : `<span class="badge-out">انصراف</span>`;
                let note = r.note ? r.note : 'لا يوجد';
                
                let rowClass = r.role && r.role.includes('مرفوضة') ? 'row-failed' : '';
                let roleDisp = r.role && r.role.includes('مرفوضة') ? `<span style="color:red; font-weight:bold;">${r.role}</span>` : (r.role||'غير محدد');

                tbody.innerHTML += `<tr class="${rowClass}"><td><strong>${r.employeeName||''}</strong></td><td>${roleDisp}</td><td>${type}</td><td dir="ltr">${formatTime(r.serverTime)}</td><td class="note-td" style="${rowClass ? 'color:red; font-weight:bold;' : ''}">${note}</td><td>${loc}</td></tr>`;
            });
        }

        function exportCSV() {
            if (filteredData.length === 0) return;
            let csv = "\uFEFFالاسم,القسم,البصمة,الوقت,ملاحظة,الموقع\n";
            filteredData.forEach(r => {
                let n = (r.employeeName||"").replace(/,/g," ");
                let role = (r.role||"").replace(/,/g," ");
                let note = (r.note||"لا يوجد").replace(/,/g," ");
                csv += `${n},${role},${r.attendanceType||""},${formatTimeExcel(r.serverTime)},${note},${(r.location||"").replace(/,/g," ")}\n`;
            });
            const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
            link.download = "تقرير_الدوام.csv"; link.click();
        }
    </script>
</body>
</html>
