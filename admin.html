<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة | سجلات الحضور</title>
    <style>
        body { font-family: 'Cairo', Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 95%; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow-x: auto; }
        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #2ecc71; padding-bottom: 10px;}
        table { width: 100%; border-collapse: collapse; margin-top: 20px; min-width: 800px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #2c3e50; color: white; font-size: 16px; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        .btn { display: block; width: 250px; margin: 20px auto; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; text-align: center; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background-color: #2ecc71; }
        #login-area { text-align: center; margin-top: 100px; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin-left: auto; margin-right: auto; }
        input[type="password"] { padding: 12px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; width: 80%; margin-bottom: 20px; text-align: center; }
        .device-info { font-size: 12px; direction: ltr; text-align: left; color: #555; }
    </style>
</head>
<body>

    <div id="login-area">
        <h2>تسجيل دخول الإدارة</h2>
        <input type="password" id="adminPass" placeholder="أدخل كلمة مرور المدير">
        <button class="btn" onclick="checkAdmin()">دخول للوحة التحكم</button>
        <p id="error-msg" style="color:red; font-weight:bold;"></p>
    </div>

    <div class="container" id="admin-area" style="display: none;">
        <h2>سجل حضور الموظفين الشامل</h2>
        <button class="btn" onclick="downloadExcel()">📥 تحميل تقرير الدوام (Excel)</button>
        
        <table id="attendanceTable">
            <thead>
                <tr>
                    <th>الرقم</th>
                    <th>اسم الموظف</th>
                    <th>وقت وتاريخ الدخول</th>
                    <th>الموقع (GPS)</th>
                    <th>نوع الجهاز والمتصفح</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <script>
        const firebaseUrl = "https://attendance-system-47995-default-rtdb.firebaseio.com/attendance.json";
        let attendanceData = [];

        function checkAdmin() {
            const pass = document.getElementById("adminPass").value;
            // كلمة مرور الدخول للوحة التحكم
            if (pass === "112233") { 
                document.getElementById("login-area").style.display = "none";
                document.getElementById("admin-area").style.display = "block";
                fetchData();
            } else {
                document.getElementById("error-msg").innerText = "كلمة المرور خاطئة!";
            }
        }

        function fetchData() {
            fetch(firebaseUrl)
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById("tableBody");
                    tbody.innerHTML = "";
                    attendanceData = [];
                    let counter = 1;

                    if (data) {
                        for (let key in data) {
                            attendanceData.push(data[key]);
                        }
                        
                        attendanceData.forEach(record => {
                            let loc = record.location || 'مجهول';
                            let locLink = loc.startsWith('http') ? `<a href="${loc}" target="_blank" style="color:blue; text-decoration:underline;">📍 عرض الخريطة</a>` : loc;
                            let device = record.deviceInfo || 'غير معروف';

                            let row = `<tr>
                                <td>${counter}</td>
                                <td><strong>${record.employeeName || 'غير معروف'}</strong></td>
                                <td>${record.deviceTime || 'غير معروف'}</td>
                                <td>${locLink}</td>
                                <td class="device-info">${device}</td>
                            </tr>`;
                            tbody.innerHTML += row;
                            counter++;
                        });
                    } else {
                        tbody.innerHTML = "<tr><td colspan='5'>لا توجد سجلات حضور حتى الآن</td></tr>";
                    }
                })
                .catch(error => console.error("Error fetching data:", error));
        }

        function downloadExcel() {
            if (attendanceData.length === 0) {
                alert("لا توجد بيانات لتحميلها!");
                return;
            }

            let csvContent = "\uFEFF"; 
            csvContent += "اسم الموظف,وقت وتاريخ الدخول,رابط الموقع,معلومات الجهاز\n"; 

            attendanceData.forEach(record => {
                let name = record.employeeName || "";
                let time = record.deviceTime || "";
                let loc = record.location || "";
                let device = record.deviceInfo || "";
                
                // تنظيف النصوص من الفواصل حتى لا يخرب الإكسل
                loc = loc.replace(/,/g, " ");
                device = device.replace(/,/g, " ");

                csvContent += `${name},${time},${loc},${device}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "تقرير_الدوام_والمواقع.csv";
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
