<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تسجيل دخول الموظفين | نظام احترافي</title>
    <!-- تضمين أيقونات Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', 'Arial', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .login-card { background-color: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; text-align: center; }
        .card-header h1 { font-size: 28px; color: #2c3e50; margin: 0 0 5px 0; }
        .card-header p { color: #7f8c8d; margin: 0; font-size: 16px; margin-bottom: 30px;}
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group .material-icons { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #bdc3c7; font-size: 22px; z-index: 2; pointer-events: none;}
        
        /* تنسيق القائمة المنسدلة */
        .input-group select, .input-group input { width: 100%; padding: 15px 15px 15px 50px; font-size: 16px; border: 2px solid #e0e6ed; border-radius: 10px; outline: none; background-color: #fafbfc; box-sizing: border-box; font-family: inherit; cursor: pointer; appearance: none; -webkit-appearance: none; -moz-appearance: none; }
        .input-group select:focus, .input-group input:focus { border-color: #2ecc71; background-color: #fff; }
        /* سهم القائمة المنسدلة */
        .select-arrow { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #bdc3c7; pointer-events: none; }

        button.login-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; font-weight: bold; margin-top: 10px;}
        button.login-btn:disabled { background: #95a5a6; cursor: not-allowed; }
        #message { margin-top: 25px; font-weight: bold; font-size: 15px; line-height: 1.6; min-height: 50px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card-header">
            <h1>بوابة الموظفين</h1>
            <p>نظام البصمة والموقع الجغرافي</p>
        </div>

        <!-- القائمة المنسدلة للأسماء -->
        <div class="input-group">
            <span class="material-icons" style="right: 15px; left: auto;">person</span>
            <select id="username" required style="padding-right: 50px; padding-left: 15px;">
                <option value="" disabled selected>اختر اسمك من القائمة...</option>
                <option value="Suhail Satar">Suhail Satar</option>
                <option value="bayna ahmed">bayna ahmed</option>
                <option value="Fatmah yamahi">Fatmah yamahi</option>
                <option value="Deema">Deema</option>
            </select>
            <span class="material-icons select-arrow">arrow_drop_down</span>
        </div>

        <div class="input-group">
            <span class="material-icons" style="right: 15px; left: auto;">lock</span>
            <input type="password" id="password" placeholder="الرقم السري الخاص بك" required style="padding-right: 50px; padding-left: 15px;">
        </div>

        <button id="loginBtn" class="login-btn" onclick="checkLogin()">تسجيل الحضور (بصمة المكان)</button>

        <p id="message"></p>
    </div>

    <script>
        // كلمات السر المخصصة لكل موظف
        const employees = {
            "Suhail Satar": "suh9988",
            "bayna ahmed": "bay5544",
            "Fatmah yamahi": "fat7766",
            "Deema": "dee3322"
        };

        const firebaseUrl = "https://attendance-system-47995-default-rtdb.firebaseio.com/attendance.json";

        function checkLogin() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value.trim();
            const msg = document.getElementById("message");
            const btn = document.getElementById("loginBtn");

            if (!user) {
                msg.style.color = "red";
                msg.innerHTML = "يرجى اختيار اسمك من القائمة أولاً.";
                return;
            }

            if (employees[user] && employees[user] === pass) {
                btn.disabled = true;
                btn.innerText = "جاري تحديد الموقع...";
                msg.style.color = "#2980b9";
                msg.innerHTML = "يرجى السماح بصلاحية الموقع (Location) إذا طلب منك المتصفح ذلك...";

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => sendDataToFirebase(user, position, null),
                        (error) => sendDataToFirebase(user, null, error)
                    );
                } else {
                    sendDataToFirebase(user, null, { message: "متصفحك لا يدعم تحديد الموقع" });
                }
            } else {
                msg.style.color = "red";
                msg.innerHTML = "الرقم السري غير صحيح! يرجى التأكد.";
            }
        }

        function sendDataToFirebase(user, position, locationError) {
            const msg = document.getElementById("message");
            const btn = document.getElementById("loginBtn");

            let locationLink = "مجهول";
            if (position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                locationLink = `https://www.google.com/maps?q=${lat},${lon}`;
            } else if (locationError) {
                locationLink = "الموظف رفض تحديد الموقع أو الخدمة مغلقة";
            }

            const deviceInfo = navigator.userAgent;

            const data = {
                employeeName: user,
                deviceTime: new Date().toLocaleString('ar-AE'),
                serverTime: { ".sv": "timestamp" },
                location: locationLink,
                deviceInfo: deviceInfo
            };

            btn.innerText = "جاري الحفظ بالسيرفر...";

            fetch(firebaseUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => {
                if(response.ok) {
                    msg.style.color = "green";
                    msg.innerHTML = `تم تسجيل الحضور بنجاح يا <span style="font-weight: 800;">${user}</span>!<br>تم رفع بصمة الموقع بنجاح.`;
                    btn.innerText = "تم التسجيل";
                } else {
                    throw new Error('Network error');
                }
            })
            .catch(error => {
                btn.disabled = false;
                btn.innerText = "تسجيل الحضور (بصمة المكان)";
                msg.style.color = "red";
                msg.innerHTML = "حدث خطأ في الاتصال، حاول مرة أخرى.";
            });
        }
    </script>
</body>
</html>
