<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الحضور والانصراف</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #1e3a8a; --primary-light: #3b82f6; --success: #10b981; 
            --danger: #ef4444; --dark: #1f2937; --bg-color: #f1f5f9; 
            --card-bg: #ffffff; --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--dark); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px 12px 30px; }
        .header-img { width: 100%; max-width: 500px; height: auto; margin-bottom: 12px; mix-blend-mode: multiply; }
        
        .top-bar { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .live-clock-badge { background: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--primary); border: 1px solid var(--border-color); display: flex; align-items: center; gap: 6px; }

        .card { background: var(--card-bg); width: 100%; max-width: 440px; padding: 24px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); border: 1px solid var(--border-color); text-align: center; }
        .system-title { font-size: 20px; color: var(--primary); font-weight: 800; margin-bottom: 20px; }

        .gps-status { background: #f8fafc; border: 1px dashed var(--border-color); border-radius: 12px; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .input-group { position: relative; margin-bottom: 14px; text-align: right; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 5px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 16px; right: 14px; }
        
        select, input { width: 100%; padding: 12px 14px 12px 14px; padding-right: 42px; font-size: 14px; border: 1.5px solid var(--border-color); border-radius: 12px; background: white; outline: none; font-weight: 600; transition: 0.2s; }
        select:focus, input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }

        .remember-box { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #64748b; margin-bottom: 18px; cursor: pointer; user-select: none; }
        .remember-box input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); }

        .action-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .btn-submit { flex: 2; padding: 13px 15px; border: none; border-radius: 12px; background: linear-gradient(135deg, #10b981, #059669); color: white; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-records { flex: 1; padding: 13px 10px; border: 1.5px solid var(--primary-light); border-radius: 12px; background: #eff6ff; color: var(--primary); font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

        #msgBox { margin-top: 15px; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; display: none; }
        .msg-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .msg-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(3px); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background: white; width: 100%; max-width: 420px; padding: 22px; border-radius: 18px; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1.5px solid var(--border-color); margin-bottom: 15px; }
        .close-btn { background: #f1f5f9; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-weight: bold; }
        .record-card { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; text-align: right; }
        .record-top { display: flex; justify-content: space-between; align-items: center; }
        .badge-in { background: #dcfce7; color: #15803d; font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: bold;}
        .badge-out { background: #fee2e2; color: #b91c1c; font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: bold;}
    </style>
</head>
<body>

    <img src="header.png" alt="Header" class="header-img" onerror="this.style.display='none'">

    <div class="top-bar">
        <div class="live-clock-badge"><i class="fa-regular fa-clock"></i> <span id="liveTime">00:00:00</span></div>
    </div>

    <div class="card">
        <h2 class="system-title"><i class="fa-solid fa-fingerprint"></i> تسجيل الدوام اليومي</h2>

        <div class="gps-status" id="gpsStatus">
            <i class="fa-solid fa-location-crosshairs fa-spin"></i>
            <span id="gpsText">جاري تحديد موقعك الجغرافي والمدينة...</span>
        </div>

        <div class="input-group">
            <label>اسم الموظف:</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-user"></i>
                <select id="userSelect"><option value="" disabled selected>جاري تحميل الموظفين...</option></select>
            </div>
        </div>

        <div class="input-group">
            <label>نوع البصمة:</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <select id="punchType">
                    <option value="حضور">دخول (حضور)</option>
                    <option value="انصراف">خروج (انصراف)</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>الرقم السري (PIN):</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="userPass" placeholder="أدخل رقمك السري" inputmode="numeric">
            </div>
        </div>

        <div class="input-group">
            <label>ملاحظة (اختياري):</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-message"></i>
                <input type="text" id="userNote" placeholder="اكتب ملاحظة إن وجدت...">
            </div>
        </div>

        <label class="remember-box">
            <input type="checkbox" id="rememberMe"><span>حفظ اسمي ورقمي السري على هذا الجهاز</span>
        </label>

        <div class="action-buttons">
            <button class="btn-submit" id="btnSubmit" onclick="submitPunch()"><i class="fa-solid fa-circle-check"></i> اعتماد البصمة</button>
            <button class="btn-records" onclick="openRecordsModal()"><i class="fa-solid fa-history"></i> سجلاتي</button>
        </div>

        <div id="msgBox"></div>
    </div>

    <div id="recordsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color:var(--primary); font-size:16px;"><i class="fa-solid fa-list-check"></i> سجلاتي</h3>
                <input type="month" id="filterMonth" onchange="openRecordsModal()" style="padding: 5px; border-radius: 5px; border: 1px solid #ccc; font-size: 12px;">
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="recordsList">جاري التحميل...</div>
        </div>
    </div>

    <script>
        const baseUrl = "https://attendance-system-47995-default-rtdb.firebaseio.com";
        const FACTORY_LAT = 25.1161977; const FACTORY_LNG = 55.2345118;
        
        // الموظفون الأساسيون (ثابتون ولا يمسحون)
        const BASE_USERS = {
            "Suhail Satar": "suh9988",
            "bayna ahmed": "bay5544",
            "Fatmah yamahi": "fat7766",
            "Deema": "dee3322"
        };
        
        let dynamicUsers = {}; 
        let currentPos = null;
        let distKm = 0;
        let cityString = "مدينة غير معروفة";

        setInterval(() => { document.getElementById("liveTime").innerText = new Date().toLocaleTimeString('ar-EG'); }, 1000);

        window.addEventListener('DOMContentLoaded', () => {
            fetchUsers();
            initGPS();
            const now = new Date(); const m = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById("filterMonth").value = `${now.getFullYear()}-${m}`;
        });

        // جلب الموظفين (دمج الأساسيين مع المضافين حديثاً)
        function fetchUsers() {
            const sel = document.getElementById("userSelect");
            sel.innerHTML = `<option value="" disabled selected>اختر اسمك...</option>`;
            
            // إضافة الأساسيين أولاً
            sel.innerHTML += `<optgroup label="الموظفون الأساسيون">`;
            for(let name in BASE_USERS) {
                sel.innerHTML += `<option value="BASE_${name}">${name}</option>`;
            }
            sel.innerHTML += `</optgroup>`;

            // جلب الموظفين المضافين من الإدارة
            fetch(`${baseUrl}/users.json`).then(res => res.json()).then(data => {
                if (data) {
                    dynamicUsers = data;
                    let hasDynamic = false;
                    let dynHtml = `<optgroup label="موظفون مضافون حديثاً">`;
                    for (let key in data) {
                        if(data[key] && data[key].name && data[key].name !== 'undefined') {
                            dynHtml += `<option value="DYN_${key}">${data[key].name}</option>`;
                            hasDynamic = true;
                        }
                    }
                    dynHtml += `</optgroup>`;
                    if(hasDynamic) sel.innerHTML += dynHtml;
                }
                loadSavedUser();
            }).catch(e => { console.log("لا يوجد موظفين إضافيين"); });
        }

        function initGPS() {
            const textEl = document.getElementById("gpsText");
            if (!navigator.geolocation) { textEl.innerText = "متصفحك لا يدعم الـ GPS"; return; }

            navigator.geolocation.getCurrentPosition(async pos => {
                currentPos = pos;
                distKm = getDist(pos.coords.latitude, pos.coords.longitude, FACTORY_LAT, FACTORY_LNG);
                try {
                    let res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&localityLanguage=ar`);
                    let geo = await res.json();
                    cityString = geo.city || geo.locality || "مدينة غير معروفة";
                } catch(e) {}
                textEl.innerHTML = `<i class="fa-solid fa-map-location-dot"></i> أنت في: ${cityString} <br> <small style="color:#10b981; font-weight:bold;">تبعد ${Math.round(distKm * 1000)} متر عن المصنع</small>`;
            }, err => {
                textEl.innerHTML = `<i class="fa-solid fa-location-slash"></i> يرجى تفعيل الـ GPS لتسجيل الموقع`;
            }, { enableHighAccuracy: true });
        }

        function getDist(lat1, lon1, lat2, lon2) {
            const R = 6371; const dLat = (lat2 - lat1) * (Math.PI / 180), dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180))*Math.cos(lat2*(Math.PI/180))*Math.sin(dLon/2)*Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function loadSavedUser() {
            const savedKey = localStorage.getItem('punch_user_key');
            const savedPass = localStorage.getItem('punch_pass');
            if (savedKey) {
                document.getElementById("userSelect").value = savedKey;
                document.getElementById("userPass").value = savedPass;
                document.getElementById("rememberMe").checked = true;
            }
        }

        function submitPunch() {
            const selVal = document.getElementById("userSelect").value;
            const punchType = document.getElementById("punchType").value;
            const pass = document.getElementById("userPass").value.trim();
            const note = document.getElementById("userNote").value.trim();
            const remember = document.getElementById("rememberMe").checked;
            const btn = document.getElementById("btnSubmit");

            if (!selVal) return showMsg("يرجى اختيار اسمك أولاً!", "error");

            let userName = ""; let expectedPin = "";
            if (selVal.startsWith("BASE_")) {
                userName = selVal.replace("BASE_", "");
                expectedPin = BASE_USERS[userName];
            } else if (selVal.startsWith("DYN_")) {
                const key = selVal.replace("DYN_", "");
                userName = dynamicUsers[key].name;
                expectedPin = dynamicUsers[key].pin;
            }

            if (pass !== expectedPin) return showMsg("الرقم السري غير صحيح!", "error");

            if (remember) { localStorage.setItem('punch_user_key', selVal); localStorage.setItem('punch_pass', pass);
            } else { localStorage.clear(); }

            btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري الاعتماد...`;

            let mapLink = currentPos ? `https://www.google.com/maps?q=${currentPos.coords.latitude},${currentPos.coords.longitude}` : '';
            const payload = { employeeName: userName, attendanceType: punchType, role: 'موظف', note: note, serverTime: { ".sv": "timestamp" }, location: mapLink, city: cityString, distance: currentPos ? `${Math.round(distKm * 1000)} متر` : 'الموقع غير متاح' };

            fetch(`${baseUrl}/attendance.json`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(res => {
                btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-circle-check"></i> اعتماد البصمة`;
                if (res.ok) { showMsg(`✅ تم تسجيل ${punchType} بنجاح (${userName})`, "success"); document.getElementById("userNote").value = ''; }
                else throw new Error();
            }).catch(() => {
                btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-circle-check"></i> اعتماد البصمة`;
                showMsg("حدث خطأ بالاتصال، يرجى المحاولة ثانية.", "error");
            });
        }

        function openRecordsModal() {
            const selVal = document.getElementById("userSelect").value;
            const pass = document.getElementById("userPass").value.trim();
            const filterMonth = document.getElementById("filterMonth").value;

            if (!selVal) return showMsg("اختر اسمك أولاً لعرض سجلاتك!", "error");
            let userName = ""; let expectedPin = "";
            if (selVal.startsWith("BASE_")) { userName = selVal.replace("BASE_", ""); expectedPin = BASE_USERS[userName]; } 
            else if (selVal.startsWith("DYN_")) { const key = selVal.replace("DYN_", ""); userName = dynamicUsers[key].name; expectedPin = dynamicUsers[key].pin; }
            
            if (pass !== expectedPin) return showMsg("أدخل رقمك السري الصحيح لعرض السجلات!", "error");

            document.getElementById("recordsModal").style.display = "flex";
            const list = document.getElementById("recordsList");
            list.innerHTML = `<div style="text-align:center; padding:20px;"><i class="fa-solid fa-spinner fa-spin"></i> جاري جلب السجلات...</div>`;

            fetch(`${baseUrl}/attendance.json`).then(res => res.json()).then(data => {
                let myRecords = [];
                for (let key in data) {
                    if (data[key].employeeName === userName) {
                        if(filterMonth && data[key].serverTime) {
                            if(new Date(data[key].serverTime).toISOString().slice(0, 7) === filterMonth) myRecords.push(data[key]);
                        } else myRecords.push(data[key]);
                    }
                }
                if (myRecords.length === 0) return list.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:20px;">لا توجد سجلات في هذا الشهر</div>`;
                myRecords.sort((a,b) => (b.serverTime||0) - (a.serverTime||0)); list.innerHTML = "";
                myRecords.forEach(r => {
                    const d = new Date(r.serverTime);
                    const badgeHtml = r.attendanceType === 'حضور' ? `<span class="badge-in">حضور</span>` : `<span class="badge-out">انصراف</span>`;
                    list.innerHTML += `<div class="record-card"><div class="record-top"><span style="font-weight:700; font-size:13px;">${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} - ${d.toLocaleTimeString('ar-EG')}</span>${badgeHtml}</div>${r.note ? `<div style="font-size:12px; color:#64748b; margin-top:5px;"><i class="fa-regular fa-comment"></i> ${r.note}</div>` : ''}</div>`;
                });
            });
        }
        function closeModal() { document.getElementById("recordsModal").style.display = "none"; }
        function showMsg(text, type) { const el = document.getElementById("msgBox"); el.style.display = "block"; el.className = `msg-${type}`; el.innerHTML = text; }
    </script>
</body>
</html>
