<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تسجيل حضور الموظفين</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p.subtitle { color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group .icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #95a5a6; pointer-events: none; }
        select, input { width: 100%; padding: 15px; padding-left: 45px; font-size: 16px; border: 2px solid #ecf0f1; border-radius: 10px; outline: none; background: #fafbfc; box-sizing: border-box; cursor: pointer; }
        select:focus, input:focus { border-color: #3498db; }
        button { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2980b9; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        #msg { margin-top: 20px; font-weight: bold; line-height: 1.5; min-height: 45px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>نظام البصمة والموقع</h2>
        <p class="subtitle">يرجى تفعيل الموقع (GPS) عند المطالبة بذلك</p>

        <!-- اختيار الاسم -->
        <div class="input-group">
            <span class="material-icons icon">person</span>
            <select id="userName" required>
                <option value="" disabled selected>اختر اسمك...</option>
                <option value="Suhail Satar">Suhail Satar</option>
                <option value="bayna ahmed">bayna ahmed</option>
                <option value="Fatmah yamahi">Fatmah yamahi</option>
                <option value="Deema">Deema</option>
            </select>
        </div>

        <!-- اختيار حضور أو انصراف -->
        <div class="input-group">
            <span class="material-icons icon">fingerprint</span>
            <select id="attendanceType" required>
                <option value="" disabled selected>نوع البصمة (حضور / انصراف)...</option>
                <option value="حضور">تسجيل دخول (حضور)</option>
                <option value="انصراف">تسجيل خروج (انصراف)</option>
            </select>
        </div>

        <!-- الرقم السري -->
        <div class="input-group">
            <span class="material-icons icon">lock</span>
            <input type="password" id="userPass" placeholder="الرقم السري" required>
        </div>

        <button id="submitBtn" onclick="processLogin()">اعتماد البصمة</button>
        <p id="msg"></p>
    </div>

    <script>
        const employees = {
            "Suhail Satar": "suh9988",
            "bayna ahmed": "bay5544",
            "Fatmah yamahi": "fat7766",
            "Deema": "dee3322"
        };
        const dbUrl = "https://attendance-system-47995-default-rtdb.firebaseio.com/attendance.json";

        function processLogin() {
            const name = document.getElementById("userName").value;
            const type = document.getElementById("attendanceType").value;
            const pass = document.getElementById("userPass").value.trim();
            const msg = document.getElementById("msg");
            const btn = document.getElementById("submitBtn");

            if (!name) { msg.style.color = "red"; msg.innerText = "يرجى اختيار الاسم!"; return; }
            if (!type) { msg.style.color = "red"; msg.innerText = "يرجى اختيار نوع البصمة (حضور أو انصراف)!"; return; }
            if (employees[name] !== pass) { msg.style.color = "red"; msg.innerText = "الرقم السري غير صحيح!"; return; }

            btn.disabled = true;
            btn.innerText = "جاري التقاط الموقع...";
            msg.style.color = "#f39c12";
            msg.innerText = "اسمح للمتصفح بتحديد موقعك (Allow Location)...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => sendData(name, type, pos, null),
                    err => sendData(name, type, null, err)
                );
            } else {
                sendData(name, type, null, true);
            }
        }

        function sendData(name, type, pos, err) {
            const msg = document.getElementById("msg");
            const btn = document.getElementById("submitBtn");
            
            let loc = "الموظف رفض تحديد الموقع";
            if (pos) loc = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;

            const data = {
                employeeName: name,
                attendanceType: type, // المعلومة الجديدة (حضور/انصراف)
                deviceTime: new Date().toLocaleString('ar-AE'),
                serverTime: { ".sv": "timestamp" },
                location: loc,
                deviceInfo: navigator.userAgent
            };

            fetch(dbUrl, { method: 'POST', body: JSON.stringify(data) })
            .then(res => {
                if(res.ok) {
                    msg.style.color = "green";
                    msg.innerHTML = `✅ تم تسجيل ${type} بنجاح يا ${name}`;
                    btn.innerText = "مكتمل";
                } else throw new Error();
            })
            .catch(() => {
                btn.disabled = false; btn.innerText = "اعتماد البصمة";
                msg.style.color = "red"; msg.innerText = "خطأ في الاتصال، أعد المحاولة.";
            });
        }
    </script>
</body>
</html>
