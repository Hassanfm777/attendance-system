<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حضور الموظفين</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .login-box { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; width: 300px; max-width: 90%; }
        input { display: block; width: 90%; margin: 10px auto; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px;}
        button:hover { background-color: #218838; }
        #message { margin-top: 20px; font-weight: bold; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>نظام تسجيل الحضور</h2>
        <input type="text" id="username" placeholder="الاسم الأول (مثال: Suhail)">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="checkLogin()">تسجيل الدخول</button>
        <p id="message"></p>
    </div>

    <script>
        // هنا حددنا أسماء الموظفين وكلمات المرور المبدئية (123)
        const employees = {
            "Suhail": "123",
            "bayna": "123",
            "Fatmah": "123",
            "Deema": "123"
        };

        function checkLogin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const msg = document.getElementById("message");

            // التحقق من صحة البيانات
            if (employees[user] && employees[user] === pass) {
                // التقاط الوقت الفعلي
                const now = new Date();
                const timeString = now.toLocaleString('ar-AE'); // صيغة الوقت لدولة الإمارات
                
                msg.style.color = "green";
                msg.innerHTML = `تم تسجيل الدخول بنجاح يا ${user}!<br>وقت الدخول: ${timeString}<br>(في الخطوات القادمة سيتم إرسال هذا الوقت لجدولك)`;
                
                // هنا سنضع لاحقاً كود إرسال البيانات إلى Google Sheets
            } else {
                msg.style.color = "red";
                msg.innerText = "اسم المستخدم أو كلمة المرور غير صحيحة! يرجى التأكد من كتابة الاسم الأول باللغة الإنجليزية كما هو محدد.";
            }
        }
    </script>
</body>
</html>
