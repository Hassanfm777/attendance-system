<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تسجيل دخول الموظفين | نظام احترافي</title>
    <!-- تضمين أيقونات Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', 'Arial', sans-serif; /* خط عربي أنيق */
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* لمنع التمرير على الجوال */
        }

        .login-card {
            background-color: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); /* ظل ناعم */
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }

        .login-card:hover {
            transform: translateY(-5px); /* تأثير بسيط عند التحويم */
        }

        .card-header {
            margin-bottom: 30px;
        }

        .card-header h1 {
            font-size: 28px;
            color: #2c3e50;
            margin: 0;
            margin-bottom: 5px;
        }

        .card-header p {
            color: #7f8c8d;
            margin: 0;
            font-size: 16px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group .material-icons {
            position: absolute;
            left: 15px; /* للأيقونات في اليسار */
            top: 50%;
            transform: translateY(-50%);
            color: #bdc3c7;
            font-size: 22px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 50px; /* تباعد من اليسار للأيقونة */
            font-size: 16px;
            border: 2px solid #e0e6ed;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: #fafbfc;
        }

        .input-group input:focus {
            border-color: #2ecc71; /* لون أخضر عند التركيز */
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
            background-color: #fff;
        }

        .input-group input[type="password"] {
            font-family: 'Arial', sans-serif; /* لكي لا يختفي شكل النجوم */
        }

        button.login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2ecc71, #27ae60); /* تدرج أخضر احترافي */
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }

        button.login-btn:hover {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            transform: scale(1.02);
        }

        #message {
            margin-top: 25px;
            font-weight: bold;
            font-size: 15px;
            line-height: 1.6;
            min-height: 50px; /* لمنع قفز العناصر */
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card-header">
            <h1>بوابة الموظفين</h1>
            <p>نظام تسجيل الدخول الآمن</p>
        </div>

        <div class="input-group">
            <span class="material-icons">person</span>
            <input type="text" id="username" placeholder="اسم الموظف الأول" required autocomplete="off">
        </div>

        <div class="input-group">
            <span class="material-icons">lock</span>
            <input type="password" id="password" placeholder="كلمة المرور" required>
        </div>

        <button class="login-btn" onclick="checkLogin()">دخول آمن</button>

        <p id="message"></p>

        <div class="footer">
            © 2026 جميع الحقوق محفوظة لشركتك
        </div>
    </div>

    <script>
        // هنا حددنا أسماء الموظفين من قائمتك وكلمة مرور موحدة "روح" كما ذكرت (123 للتبسيط الآن)
        const employees = {
            "Suhail": "123",
            "bayna": "123",
            "Fatmah": "123",
            "Deema": "123"
        };

        function checkLogin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const msg = document.getElementById("message");

            // التحقق من صحة البيانات
            if (employees[user] && employees[user] === pass) {
                // التقاط الوقت الفعلي
                const now = new Date();
                const timeString = now.toLocaleString('ar-AE'); // صيغة الوقت لدولة الإمارات

                msg.style.color = "green";
                msg.innerHTML = `تم تسجيل الدخول بنجاح، يا <span style="font-weight: 800;">${user}</span>!<br>وقت الدخول: ${timeString}<br>(سيتم حفظ هذا الوقت في جدولك في الخطوة التالية)`;

                // هنا سنضع كود إرسال البيانات إلى Google Sheets في الخطوات القادمة
            } else {
                msg.style.color = "red";
                msg.innerHTML = "اسم المستخدم أو كلمة المرور غير صحيحة! يرجى التأكد من كتابة الاسم الأول باللغة الإنجليزية كما هو محدد (مثل Suhail).";
            }
        }
    </script>
</body>
</html>
